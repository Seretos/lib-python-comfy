[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lib-python-comfy"
version = "0.1.1"
description = "ComfyUI API and workflow client library - programmatic access to ComfyUI graphs, the prompt queue, and generated outputs"
requires-python = ">=3.11"
authors = [{ name = "Arne von Appen" }]
# Runtime deps go here. Keep the surface small — this is a leaf dependency
# consumed by other projects. Empty by default.
dependencies = [
  "httpx>=0.27",
  "pydantic>=2",
  "Pillow>=10",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.3",
]
hf = [
  "huggingface_hub>=0.20",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lib_python_comfy.template_data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers -p pytester"
asyncio_mode = "auto"
timeout = 60
timeout_method = "thread"
