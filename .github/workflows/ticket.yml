name: open-dep-ticket

# Manual recovery workflow: re-open the dependency-update ticket in the
# downstream consumer repo (Seretos/agent-comfy) when the automatic step in
# release.yml was skipped or failed (e.g. missing token at release time).
#
# Design: independence + failure visibility.
#   - The semver validation step runs first with no continue-on-error; an
#     invalid version halts the job before any ticket is filed.
#   - The consumer step carries continue-on-error: true so a broken token
#     never silently swallows the failure — the final report step surfaces it.
#   - A final "Report consumer failures" step (if: always()) inspects the
#     outcome and exits non-zero if it failed, turning the job red and naming
#     exactly which token needs attention.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "lib-python-comfy version to reference (semver, no leading v) e.g. 0.2.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  file-tickets:
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Validate version is semver
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "ERROR: version must be semver without a leading 'v' (e.g. 0.2.0), got: $VERSION"
            exit 1
          fi

      - name: Open dependency-update ticket in agent-comfy
        id: file_comfy
        continue-on-error: true
        shell: bash
        # TITLE/BODY_HEAD/BODY_TAIL live in env (not a run-block heredoc): a
        # heredoc body at column 0 dedents out of the YAML block scalar and
        # breaks the file. A YAML block scalar holds the markdown verbatim
        # and ${{ }} still expands. Bash assembles the final $BODY from
        # these plus the fetched $CHANGELOG (see run: below).
        env:
          # COMFY_TICKET_TOKEN must be a classic PAT with the `repo` and
          # `project` scopes — fine-grained PATs have no Projects permission
          # at all, so the board-add step further down authenticates with
          # this same classic-PAT secret — no separate secret to maintain.
          GH_TOKEN: ${{ secrets.COMFY_TICKET_TOKEN }}
          TITLE: "chore(deps): bump lib-python-comfy to v${{ inputs.version }}"
          BODY_HEAD: |
            ## Dependency update

            A new release of **lib-python-comfy** has been published: `v${{ inputs.version }}`.
          BODY_TAIL: |
            ### Action required

            1. Update the pin in `pyproject.toml` to:
               ```
               lib-python-comfy @ git+https://github.com/Seretos/lib-python-comfy@v${{ inputs.version }}
               ```
            2. Run `pip install -e ".[test]"` then `python -m pytest` to verify the test suite passes.
            3. Confirm the package imports: `python -c "import lib_python_comfy"`.
            4. Commit and open a PR.
        run: |
          CONSUMER="Seretos/agent-comfy"
          TAG="v${{ inputs.version }}"

          # Fetch the release's notes to enrich the ticket body with a
          # "### What changed" section. A missing release (404) is bad
          # input — this workflow only makes sense for an already-published
          # version — so it halts before any ticket is filed, mirroring the
          # semver-validation failure above. Any other fetch failure
          # degrades gracefully: warn and omit the section.
          CHANGELOG=""
          GH_CHANGELOG_ERR="$(mktemp)"
          if CHANGELOG=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq '.body // ""' 2>"$GH_CHANGELOG_ERR"); then
            :
          else
            FETCH_ERR="$(cat "$GH_CHANGELOG_ERR")"
            if echo "$FETCH_ERR" | grep -qE '\(HTTP 404\)|[Nn]ot [Ff]ound'; then
              echo "::error::No GitHub Release found for ${TAG} in ${{ github.repository }}; cannot file a ticket for a version that was never released."
              rm -f "$GH_CHANGELOG_ERR"
              exit 1
            fi
            echo "::warning::Failed to fetch changelog for ${TAG}: ${FETCH_ERR}"
            CHANGELOG=""
          fi
          rm -f "$GH_CHANGELOG_ERR"

          # Assemble BODY by direct string concatenation, never through
          # $(...): command substitution strips trailing newlines, which
          # is what silently broke the blank-line spacing here before.
          # BODY_HEAD already ends in exactly one newline (YAML block
          # scalar clip chomping); prefixing the next chunk with exactly
          # one more newline reproduces the single-blank-line-between-
          # sections convention the rest of the document uses, in both
          # the no-changelog and with-changelog cases.
          if [ -n "$CHANGELOG" ]; then
            BODY="${BODY_HEAD}"$'\n'"### What changed"$'\n\n'"${CHANGELOG}"$'\n\n'"${BODY_TAIL}"
          else
            BODY="${BODY_HEAD}"$'\n'"${BODY_TAIL}"
          fi

          # Idempotency: skip if an open issue with this exact title already
          # exists — reuse its URL instead of creating a duplicate.
          # --paginate follows all pages; jq filter excludes pull requests.
          ISSUE_URL=$(gh api --paginate "repos/${CONSUMER}/issues?state=open&per_page=100" \
            --jq --arg t "$TITLE" 'map(select((.pull_request|not) and (.title==$t))) | .[0].html_url // empty' 2>/dev/null || true)
          if [ -n "$ISSUE_URL" ]; then
            echo "Issue already exists in ${CONSUMER}, skipping."
            CREATED="false"
          else
            # Attempt creation with the 'dependencies' label; fall back
            # without it if the label does not exist in the consumer repo.
            ISSUE_URL=$(gh issue create \
              --repo "$CONSUMER" \
              --title "$TITLE" \
              --body "$BODY" \
              --label dependencies \
            || gh issue create \
              --repo "$CONSUMER" \
              --title "$TITLE" \
              --body "$BODY")
            echo "Ticket opened in ${CONSUMER}: ${ISSUE_URL}"
            CREATED="true"
          fi
          echo "issue_url=${ISSUE_URL}" >> "$GITHUB_OUTPUT"
          echo "created=${CREATED}" >> "$GITHUB_OUTPUT"

      - name: Add agent-comfy ticket to project board
        if: steps.file_comfy.outputs.issue_url != ''
        continue-on-error: true
        shell: bash
        env:
          # Reuses COMFY_TICKET_TOKEN, which must be a classic PAT carrying
          # both `repo` and `project` scopes.
          GH_TOKEN: ${{ secrets.COMFY_TICKET_TOKEN }}
        run: |
          ITEM_ID=$(gh project item-add 2 --owner Seretos --url "${{ steps.file_comfy.outputs.issue_url }}" --format json --jq '.id')

          # Only a freshly created ticket gets its board status set — a
          # reused (already-existing) issue may have been moved by a human
          # since, and a re-run must never yank it back to Backlog.
          if [ "${{ steps.file_comfy.outputs.created }}" != "true" ]; then
            echo "Issue was reused (not newly created); leaving its board status untouched."
            exit 0
          fi

          PROJECT_ID=$(gh project view 2 --owner Seretos --format json --jq '.id' || true)
          STATUS_FIELD_ID=$(gh project field-list 2 --owner Seretos --format json --jq '(.fields? // .)[] | select(.name=="Status") | .id' || true)
          BACKLOG_OPTION_ID=$(gh project field-list 2 --owner Seretos --format json --jq '(.fields? // .)[] | select(.name=="Status") | .options[] | select(.name=="Backlog") | .id' || true)

          if [ -z "$PROJECT_ID" ] || [ -z "$STATUS_FIELD_ID" ] || [ -z "$BACKLOG_OPTION_ID" ]; then
            echo "::warning::Could not resolve project/Status-field/Backlog-option IDs; leaving new card's status unset."
            exit 0
          fi

          gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" --field-id "$STATUS_FIELD_ID" --single-select-option-id "$BACKLOG_OPTION_ID"

      - name: Report consumer failures
        if: always()
        shell: bash
        run: |
          failed=0
          if [ "${{ steps.file_comfy.outcome }}" = "failure" ]; then
            echo "::error::Filing in Seretos/agent-comfy failed (check COMFY_TICKET_TOKEN)."
            failed=1
          fi
          exit $failed
