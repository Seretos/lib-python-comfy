name: release

# Manual lib-release flow. Analogous to the plugin's release.yml but
# without the binary build (libs ship as Python source distributions
# pulled by downstream consumers via `git+https://.../@vX.Y.Z` or
# `@release/Nx`). Topology:
#
#   stamp+publish (ubuntu-22.04) -> validates semver, fails on
#                                   duplicate tag, stamps pyproject.toml
#                                   with the requested version on a
#                                   fresh release branch built off main,
#                                   tags the stamp commit as vX.Y.Z,
#                                   force-pushes release/Nx (the
#                                   floating branch downstream consumers
#                                   pin to), and creates the GitHub
#                                   Release. `main` is never touched —
#                                   the bot commit lives only on the
#                                   release/Nx branch.
#
# Release-branch policy:
#   release/0.x  — all 0.x.y releases.   Force-pushed each release.
#   release/1.x  — all 1.x.y releases.   Created the first time a 1.x.y
#                  release is published; force-pushed each release after.
#   release/Nx   — analogous.
#
# Past tags remain reachable via `git+https://.../@vX.Y.Z` even after
# a force-push because the commit they point to is preserved by git as
# long as the tag exists.
#
# No MARKETPLACE_DISPATCH_TOKEN: a lib never dispatches into the
# marketplace. This workflow uses only the built-in secrets.GITHUB_TOKEN.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver, no leading v) e.g. 0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Validate version is semver
        shell: bash
        run: |
          V="${{ inputs.version }}"
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$V' is not valid semver (expected MAJOR.MINOR.PATCH[-PRERELEASE])."
            exit 1
          fi

      - name: Check tag does not yet exist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          if gh api "repos/${{ github.repository }}/git/refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. Delete it first or pick a new version."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute release-branch name
        id: branch
        shell: bash
        run: |
          V="${{ inputs.version }}"
          MAJOR=$(echo "$V" | cut -d. -f1)
          BRANCH="release/${MAJOR}.x"
          echo "name=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Will publish to ${BRANCH}"

      - name: Stamp pyproject.toml, commit, tag, force-push release branch
        # Stamp via sed (POSIX, no extra tools), anchored to start of
        # line to avoid touching nested versions in tool tables. The
        # stamp commit lives only on the release/Nx branch — main
        # stays at whatever HEAD it was before this workflow ran.
        shell: bash
        run: |
          V="${{ inputs.version }}"
          TAG="v${V}"
          BRANCH="${{ steps.branch.outputs.name }}"

          sed -i -E 's/^(version[[:space:]]*=[[:space:]]*")[^"]*(")/\1'"$V"'\2/' pyproject.toml
          grep -E "^version[[:space:]]*=[[:space:]]*\"$V\"" pyproject.toml \
            || { echo "::error::pyproject.toml stamp failed"; exit 1; }

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Build the release branch fresh from main HEAD each time.
          # Past tags pin past commits — they are independent of where
          # the release/Nx pointer currently sits.
          git checkout -B "$BRANCH"
          git add pyproject.toml
          git commit -m "release: ${TAG}"

          git tag -a "$TAG" -m "${TAG}"

          git push origin "$BRANCH" --force
          git push origin "$TAG"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          PRE_FLAG=""
          if [[ "${{ inputs.version }}" == *-* ]]; then
            PRE_FLAG="--prerelease"
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes \
            $PRE_FLAG

      - name: Open dependency-update ticket in agent-comfy
        # continue-on-error: a missing/invalid COMFY_TICKET_TOKEN must
        # never fail the release itself.
        id: file_comfy
        continue-on-error: true
        shell: bash
        # TITLE/BODY_HEAD/BODY_TAIL live in env (not a run-block heredoc): a
        # heredoc body at column 0 dedents out of the YAML block scalar and
        # breaks the file. A YAML block scalar holds the markdown verbatim
        # and ${{ }} still expands. Bash assembles the final $BODY from
        # these plus the fetched $CHANGELOG (see run: below).
        env:
          # COMFY_TICKET_TOKEN must be a classic PAT with the `repo` and
          # `project` scopes — fine-grained PATs have no Projects permission
          # at all, so the board-add step further down authenticates with
          # this same classic-PAT secret — no separate secret to maintain.
          GH_TOKEN: ${{ secrets.COMFY_TICKET_TOKEN }}
          TITLE: "chore(deps): bump lib-python-comfy to v${{ inputs.version }}"
          BODY_HEAD: |
            ## Dependency update

            A new release of **lib-python-comfy** has been published: `v${{ inputs.version }}`.
          BODY_TAIL: |
            ### Action required

            1. Update the pin in `pyproject.toml` to:
               ```
               lib-python-comfy @ git+https://github.com/Seretos/lib-python-comfy@v${{ inputs.version }}
               ```
            2. Run `pip install -e ".[test]"` then `python -m pytest` to verify the test suite passes.
            3. Confirm the package imports: `python -c "import lib_python_comfy"`.
            4. Commit and open a PR.
        run: |
          CONSUMER="Seretos/agent-comfy"
          TAG="v${{ inputs.version }}"

          # Fetch the just-published release's notes to enrich the ticket
          # body with a "### What changed" section. The release was created
          # by the preceding step in this same job, so a fetch failure here
          # is unexpected — but it must still never fail the release itself,
          # so any failure (including a 404) just degrades: warn and omit
          # the section.
          CHANGELOG=""
          GH_CHANGELOG_ERR="$(mktemp)"
          if CHANGELOG=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq '.body // ""' 2>"$GH_CHANGELOG_ERR"); then
            :
          else
            echo "::warning::Failed to fetch changelog for ${TAG}: $(cat "$GH_CHANGELOG_ERR")"
            CHANGELOG=""
          fi
          rm -f "$GH_CHANGELOG_ERR"

          # Assemble BODY by direct string concatenation, never through
          # $(...): command substitution strips trailing newlines, which
          # is what silently broke the blank-line spacing here before.
          # BODY_HEAD already ends in exactly one newline (YAML block
          # scalar clip chomping); prefixing the next chunk with exactly
          # one more newline reproduces the single-blank-line-between-
          # sections convention the rest of the document uses, in both
          # the no-changelog and with-changelog cases.
          if [ -n "$CHANGELOG" ]; then
            BODY="${BODY_HEAD}"$'\n'"### What changed"$'\n\n'"${CHANGELOG}"$'\n\n'"${BODY_TAIL}"
          else
            BODY="${BODY_HEAD}"$'\n'"${BODY_TAIL}"
          fi

          # Idempotency: skip if an open issue with this exact title already
          # exists — reuse its URL instead of creating a duplicate.
          # --paginate follows all pages; jq filter excludes pull requests.
          ISSUE_URL=$(gh api --paginate "repos/${CONSUMER}/issues?state=open&per_page=100" \
            --jq --arg t "$TITLE" 'map(select((.pull_request|not) and (.title==$t))) | .[0].html_url // empty' 2>/dev/null || true)
          if [ -n "$ISSUE_URL" ]; then
            echo "Issue already exists in ${CONSUMER}, skipping."
            CREATED="false"
          else
            # Attempt creation with the 'dependencies' label; fall back
            # without it if the label does not exist in the consumer repo.
            ISSUE_URL=$(gh issue create \
              --repo "$CONSUMER" \
              --title "$TITLE" \
              --body "$BODY" \
              --label dependencies \
            || gh issue create \
              --repo "$CONSUMER" \
              --title "$TITLE" \
              --body "$BODY")
            echo "Ticket opened in ${CONSUMER}: ${ISSUE_URL}"
            CREATED="true"
          fi
          echo "issue_url=${ISSUE_URL}" >> "$GITHUB_OUTPUT"
          echo "created=${CREATED}" >> "$GITHUB_OUTPUT"

      - name: Add agent-comfy ticket to project board
        if: steps.file_comfy.outputs.issue_url != ''
        continue-on-error: true
        shell: bash
        env:
          # Reuses COMFY_TICKET_TOKEN, which must be a classic PAT carrying
          # both `repo` and `project` scopes.
          GH_TOKEN: ${{ secrets.COMFY_TICKET_TOKEN }}
        run: |
          ITEM_ID=$(gh project item-add 2 --owner Seretos --url "${{ steps.file_comfy.outputs.issue_url }}" --format json --jq '.id')

          # Only a freshly created ticket gets its board status set — a
          # reused (already-existing) issue may have been moved by a human
          # since, and a re-run must never yank it back to Backlog.
          if [ "${{ steps.file_comfy.outputs.created }}" != "true" ]; then
            echo "Issue was reused (not newly created); leaving its board status untouched."
            exit 0
          fi

          PROJECT_ID=$(gh project view 2 --owner Seretos --format json --jq '.id' || true)
          STATUS_FIELD_ID=$(gh project field-list 2 --owner Seretos --format json --jq '(.fields? // .)[] | select(.name=="Status") | .id' || true)
          BACKLOG_OPTION_ID=$(gh project field-list 2 --owner Seretos --format json --jq '(.fields? // .)[] | select(.name=="Status") | .options[] | select(.name=="Backlog") | .id' || true)

          if [ -z "$PROJECT_ID" ] || [ -z "$STATUS_FIELD_ID" ] || [ -z "$BACKLOG_OPTION_ID" ]; then
            echo "::warning::Could not resolve project/Status-field/Backlog-option IDs; leaving new card's status unset."
            exit 0
          fi

          gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" --field-id "$STATUS_FIELD_ID" --single-select-option-id "$BACKLOG_OPTION_ID"
